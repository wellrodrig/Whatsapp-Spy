name: Android CI

on:
  push:
    branches: [ "master" ]          # Ganti ke "main" kalau branch utama kamu "main"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:                # Biar bisa run manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace   # Ganti dari 'build' ke 'assembleDebug' supaya lebih cepat & fokus APK

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
